[package]
name = "silica-sweep"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "silica_sweep"
path = "src/lib.rs"

[[bin]]
name = "silica-sweep"
path = "src/main.rs"

[dependencies]
silica-oracles = { path = "../silica-oracles" }
silica-bitmap = { path = "../silica-bitmap" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
