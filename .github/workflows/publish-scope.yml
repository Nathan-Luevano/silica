name: publish silica-scope to PyPI

# manual only - a release published from GitHub, or a maintainer clicking
# "Run workflow". Never fires on an ordinary push, so it can't publish
# by accident.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build tui/ --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: silica-scope-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing - no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: silica-scope-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
