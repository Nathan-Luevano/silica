[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silica"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = [
  "import-linter",
]

[project.scripts]
silica = "pysilica.cli:app"

[tool.setuptools.packages.find]
include = ["pysilica*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["D"]

[tool.mypy]
strict = true
packages = ["pysilica"]

[[tool.mypy.overrides]]
module = ["capstone", "unicorn"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "pysilica"

[[tool.importlinter.contracts]]
name = "model has no downstream imports"
type = "forbidden"
source_modules = ["pysilica.model"]
forbidden_modules = ["pysilica.spec", "pysilica.analyze", "pysilica.report", "pysilica.verify", "pysilica.cli", "pysilica.doctor"]

[[tool.importlinter.contracts]]
name = "analyze/report/verify import model only, not cli"
type = "forbidden"
source_modules = ["pysilica.analyze", "pysilica.report", "pysilica.verify"]
forbidden_modules = ["pysilica.cli"]

[[tool.importlinter.contracts]]
name = "nothing imports cli"
type = "forbidden"
source_modules = ["pysilica.model", "pysilica.spec", "pysilica.analyze", "pysilica.report", "pysilica.verify", "pysilica.doctor"]
forbidden_modules = ["pysilica.cli"]
